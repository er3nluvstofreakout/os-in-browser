name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

      username:
        description: Username
        type: string
        required: true

      password:
        description: Password
        type: string
        required: true

jobs:
  job:
    name: URL
    runs-on: ${{ inputs.os }}

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Run remote desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PORT: 8080
          METRICS_URL: "localhost:8081"
          CLOUDFLARED_LOG: "${{ runner.temp }}/cloudflared.log"
        run: |
          case "$RUNNER_OS" in
            Windows)
              CLOUDFLARED=./cloudflared.exe
              ZIP_NAME="os-in-browser-win32-x64-1.0.0.zip"
              CLOUDFLARED_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
              ;;

            Linux)
              CLOUDFLARED=./cloudflared
              ZIP_NAME="os-in-browser-linux-x64-1.0.0.zip"
              CLOUDFLARED_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
              ;;

            macOS)
              CLOUDFLARED=./cloudflared
              ZIP_NAME="os-in-browser-darwin-arm64-1.0.0.zip"
              CLOUDFLARED_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz"
              ;;
          esac

          if [[ "$RUNNER_OS" == macOS ]]; then
            curl -fsSL "$CLOUDFLARED_URL" | tar -xz
          else
            curl -fsSL "$CLOUDFLARED_URL" -o "$CLOUDFLARED"
          fi

          chmod +x "$CLOUDFLARED"

          "$CLOUDFLARED" tunnel \
            --url "http://localhost:$PORT" \
            >"$CLOUDFLARED_LOG" 2>&1 &

          CLOUDFLARED_PID=$!
          trap 'kill "$CLOUDFLARED_PID" 2>/dev/null || true' EXIT

          export TUNNEL_URL="$(
            tail -f "$CLOUDFLARED_LOG" |
              grep --line-buffered -m1 -oE 'https://[a-z0-9-]+\.trycloudflare\.com'
          )"

          export USERNAME="$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$USERNAME"

          export PASSWORD="$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$PASSWORD"

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP_NAME" \
          || gh release download \
            --repo "kingdudely/os-in-browser" \
            --pattern "$ZIP_NAME"

          unzip -q "$ZIP_NAME" || {
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          }

          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update

              sudo apt-get install -y --no-install-recommends \
                icewm \
                xvfb \
                libx11-6 \
                libxtst6 \
                libxfixes3

              read -r DISPLAY_NUMBER < <(
                Xvfb \
                  -displayfd 1 \
                  -screen 0 1920x1080x24 \
                  +extension XTEST \
                  +extension XFIXES \
                  -nolisten tcp
              )

              export DISPLAY=":$DISPLAY_NUMBER"

              icewm-session &

              ./os-in-browser-linux-x64/os-in-browser
              ;;

            Windows)
              ./os-in-browser-win32-x64/os-in-browser.exe
              ;;

            macOS)
              chmod +x ./os-in-browser.app/Contents/MacOS/os-in-browser
              ./os-in-browser.app/Contents/MacOS/os-in-browser
              ;;
          esac