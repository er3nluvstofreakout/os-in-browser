name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

      username:
        description: Username
        type: string
        required: true

      password:
        description: Password
        type: string
        required: true

jobs:
  job:
    name: URL
    runs-on: ${{ inputs.os }}

    env:
      PORT: 8080

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Run remote desktop
        env:
          PORT: 8080
          METRICS_URL: "localhost:8081"
          GH_TOKEN: ${{ github.token }}
          TUNNEL_URL: ${{ steps.tunnel.outputs.server }}
          GITHUB_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ runner.os }}-${{ runner.arch }}.zip
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"

          case "$RUNNER_OS" in
            Linux)
              sudo mkdir -p --mode=0755 /usr/share/keyrings
              curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
              echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflared.list

              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                cloudflared \
                icewm \
                xvfb \
                libx11-6 \
                libxtst6 \
                libxfixes3

              read -r DISPLAY_NUMBER < <(
                Xvfb \
                  -displayfd 1 \
                  -screen 0 1920x1080x24 \
                  +extension XTEST \
                  +extension XFIXES \
                  -nolisten tcp
              )

              export DISPLAY=":$DISPLAY_NUMBER"

              icewm-session &

              OS_IN_BROWSER=./os-in-browser

              ;;

            Windows)
              choco install -y cloudflared
              OS_IN_BROWSER=./os-in-browser.exe

              ;;

            macOS)
              brew install cloudflared
              OS_IN_BROWSER=./os-in-browser.app/Contents/MacOS/os-in-browser

              ;;
          esac

          cloudflared tunnel --metrics="${METRICS_URL}" --url "http://localhost:${PORT}"

          until JSON="$(curl -sS "${METRICS_URL}/quicktunnel")"; do # cloudflared ready
            sleep 1
          done

          HOSTNAME="$(jq -r '.hostname' <<< "${QUICKTUNNEL}")"
          TUNNEL_URL="https://${HOSTNAME}"

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${ZIP_NAME}"

          unzip -q "${ZIP_NAME}"

          "${OS_IN_BROWSER}"