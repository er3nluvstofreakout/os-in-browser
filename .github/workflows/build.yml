name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install # ci

      - name: Build Linux
        background: true
        run: |
          npm run make -- \
            --platform=linux \
            --arch=x64

      - name: Build Windows
        background: true
        run: |
          npm run make -- \
            --platform=win32 \
            --arch=x64

      - name: Build macOS
        background: true
        run: |
          npm run make -- \
            --platform=darwin \
            --arch=arm64

      - name: Wait for builds
        wait-all:

      - name: Show builds
        run: |
          find out/make/zip -type f -name '*.zip' -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ inputs.version }}" \
            $(find out/make/zip -type f -name '*.zip') \
            --title "v${{ inputs.version }}" \
            --generate-notes