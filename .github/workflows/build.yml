name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Download cloudflared
        run: |
          mkdir -p cloudflared

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o cloudflared/linux

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" \
            -o cloudflared/windows.exe

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" |
            tar -xz -C cloudflared

          mv cloudflared/cloudflared cloudflared/macos

          chmod +x cloudflared/linux
          chmod +x cloudflared/macos

      - name: Build all platforms
        run: |
          (
            TARGET_PLATFORM=linux \
            npm run make -- --platform=linux --arch=x64
          ) &
          linux_pid=$!

          (
            TARGET_PLATFORM=win32 \
            npm run make -- --platform=win32 --arch=x64
          ) &
          windows_pid=$!

          (
            TARGET_PLATFORM=darwin \
            npm run make -- --platform=darwin --arch=arm64
          ) &
          macos_pid=$!

          failed=0

          wait "$linux_pid" || failed=1
          wait "$windows_pid" || failed=1
          wait "$macos_pid" || failed=1

          exit "$failed"

      - name: Show build output
        run: |
          find out -type f -name '*.zip' -print

      - name: Prepare releases
        run: |
          mkdir -p releases

          find out/make/zip -type f -name '*.zip' -exec cp {} releases/ \;

          ls -lh releases

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: releases
          path: releases/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ inputs.version }}" \
            releases/*.zip \
            --title "v${{ inputs.version }}" \
            --generate-notes